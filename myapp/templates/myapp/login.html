<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ZORO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --primary-hover: #4facfe;
            --dark-bg: #050b14;
            --darker-bg: #02060c;
            --light-text: #f8fafc;
            --muted-text: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: var(--light-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/media/logo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.08;
            z-index: -2;
            pointer-events: none;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.06) 0%, transparent 60%);
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
        }

        /* Navbar */
        nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 1.8rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--light-text);
        }

        .nav-link {
            text-decoration: none;
            color: var(--muted-text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        /* Login Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 5%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--glass-shadow);
        }

        .login-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--muted-text);
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--light-text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* Selection Styling */
        .role-selection {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .role-card i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .role-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .role-card p {
            font-size: 0.85rem;
            color: var(--muted-text);
        }

        .role-card:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        .hidden {
            display: none;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--muted-text);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 1.5rem;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted-text);
            cursor: pointer;
        }

        .remember-me input {
            cursor: pointer;
            accent-color: var(--primary);
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .forgot-password:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--muted-text);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <nav>
        <a href="/" class="logo-container">
            <i class="fa-solid fa-scale-balanced logo-icon"></i>
            <span class="logo-text">ZORO</span>
        </a>
        <a href="/" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </nav>

    <main>
        <div class="login-card">
            <h1 id="loginTitle">Login to ZORO</h1>
            
            <!-- Selection State -->
            <div id="selectionArea" class="role-selection">
                <div class="role-card" onclick="showLoginForm('company')">
                    <i class="fa-solid fa-building"></i>
                    <h3>Login as Company</h3>
                    <p>Manage your entire organization and budgets.</p>
                </div>
                <div class="role-card" onclick="showLoginForm('employee')">
                    <i class="fa-solid fa-user-tie"></i>
                    <h3>Login as Employee</h3>
                    <p>Raise budget needs and track your department.</p>
                </div>
            </div>

            <!-- Company Login Form -->
            <form action="#" method="POST" id="companyLoginForm" class="hidden">
                <button type="button" class="back-btn" onclick="showSelection()"><i class="fa-solid fa-chevron-left"></i> Change Role</button>
                <div class="form-group">
                    <label for="companyEmail">Company Email</label>
                    <input type="email" id="companyEmail" name="email" class="form-input" placeholder="admin@company.com" required>
                </div>
                
                <div class="form-group">
                    <label for="companyPassword">Password</label>
                    <input type="password" id="companyPassword" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember Me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Company Login <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <!-- Employee Login Form -->
            <form action="#" method="POST" id="employeeLoginForm" class="hidden">
                <button type="button" class="back-btn" onclick="showSelection()"><i class="fa-solid fa-chevron-left"></i> Change Role</button>
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="companyName" class="form-input" placeholder="Enter company name" required>
                </div>
                
                <div class="form-group">
                    <label for="employeeId">Employee ID</label>
                    <input type="text" id="employeeId" name="employeeId" class="form-input" placeholder="ZORO-EMP-XXXXX" required>
                </div>
                
                <div class="form-group">
                    <label for="employeePassword">Password</label>
                    <input type="password" id="employeePassword" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember Me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Employee Login <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <div class="footer-text">
                Don't have an account? <a href="/register/">Register Company</a>
            </div>
        </div>
    </main>

    <script>
        const selectionArea = document.getElementById('selectionArea');
        const companyForm = document.getElementById('companyLoginForm');
        const employeeForm = document.getElementById('employeeLoginForm');
        const loginTitle = document.getElementById('loginTitle');

        function showLoginForm(role) {
            selectionArea.classList.add('hidden');
            if (role === 'company') {
                companyForm.classList.remove('hidden');
                loginTitle.textContent = "Company Login";
            } else {
                employeeForm.classList.remove('hidden');
                loginTitle.textContent = "Employee Login";
            }
        }

        function showSelection() {
            companyForm.classList.add('hidden');
            employeeForm.classList.add('hidden');
            selectionArea.classList.remove('hidden');
            loginTitle.textContent = "Login to ZORO";
        }

        // Handle submissions (Simulated)
        companyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirect as ADMIN for Company Login
            window.location.href = "{% url 'dashboard' %}?role=ADMIN";
        });

        employeeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirect as EMPLOYEE for standard Employee Login
            window.location.href = "{% url 'dashboard' %}?role=EMPLOYEE";
        });
    </script>
</body>
</html>
