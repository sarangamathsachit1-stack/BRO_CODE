<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ZORO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --primary-hover: #4facfe;
            --dark-bg: #050b14;
            --darker-bg: #02060c;
            --light-text: #f8fafc;
            --muted-text: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: var(--light-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.06) 0%, transparent 60%);
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
        }

        /* Navbar */
        nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 1.8rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--light-text);
        }

        .nav-link {
            text-decoration: none;
            color: var(--muted-text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 5%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 550px;
            box-shadow: var(--glass-shadow);
        }

        .register-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--muted-text);
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--light-text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* Subscription Section */
        .subscription-section {
            margin-top: 2.5rem;
        }

        .subscription-section h2 {
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            color: var(--light-text);
            font-weight: 600;
        }

        .plan-card {
            background: rgba(0, 242, 254, 0.05);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .plan-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .plan-price {
            font-weight: 800;
            font-size: 1.3rem;
        }

        .features-list {
            list-style: none;
        }

        .features-list li {
            font-size: 0.9rem;
            color: var(--muted-text);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .features-list li i {
            color: var(--primary);
            font-size: 0.8rem;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            margin-top: 2.5rem;
            padding: 1rem;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <nav>
        <a href="/" class="logo-container">
            <i class="fa-solid fa-scale-balanced logo-icon"></i>
            <span class="logo-text">ZORO</span>
        </a>
        <a href="#" class="nav-link">Bank Profile</a>
    </nav>

    <main>
        <div class="register-card">
            <h1>Register Your Company</h1>
            
            <form action="#" method="POST" id="registerForm">
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="companyName" class="form-input" placeholder="e.g. Acme Corp" required>
                </div>
                
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" class="form-input" placeholder="9876543210" pattern="[0-9]{10}" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="admin@company.com" required>
                </div>
                
                <div class="form-group">
                    <label for="gst">GST Number (Optional)</label>
                    <input type="text" id="gst" name="gst" class="form-input" placeholder="22AAAAA0000A1Z5">
                </div>

                <div class="subscription-section">
                    <h2>Choose Your Plan</h2>
                    <div class="plan-card">
                        <div class="plan-header">
                            <span class="plan-name">ZORO Standard</span>
                            <span class="plan-price">₹1999</span>
                        </div>
                        <ul class="features-list">
                            <li><i class="fa-solid fa-check"></i> Real-time budget allocation</li>
                            <li><i class="fa-solid fa-check"></i> Multi-department collaboration</li>
                            <li><i class="fa-solid fa-check"></i> Conflict resolution engine</li>
                            <li><i class="fa-solid fa-check"></i> Audit trail and history</li>
                        </ul>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Continue to Payment <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Basic validation is handled by HTML5 attributes
            // Redirecting to onboarding as the next step
            window.location.href = "{% url 'onboarding' %}";
        });
    </script>
</body>
</html>
